<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Important NEET-PG counselling updates from ASMI Youth Career Advisor, listed date-wise with the official PDF notice for each.">
<title>NEET-PG Important Updates | ASMI Career</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f4f1ff;--surface:#ffffff;--fg:#1d1a3b;--muted:#5f5a82;--line:#e4def7;--accent:#5b21b6;--accent-fg:#ffffff;--good:#0f7a43;--good-bg:#d9f5e5;--soft:#efeaff;--hero1:#2a0a6b;--hero2:#6d28d9;--yellow:#ffd60a;--ink:#2e1065;--shadow:0 6px 18px rgba(91,33,182,.10)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f2b;--surface:#1e1740;--fg:#ece8ff;--muted:#a9a4cc;--line:#372d66;--accent:#b79cff;--accent-fg:#1a0f3d;--good:#7fe2a8;--good-bg:#143a27;--soft:#2a2158;--hero1:#1c0850;--hero2:#4c1fa8;--ink:#ffe27a;--shadow:0 6px 18px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150f2b;--surface:#1e1740;--fg:#ece8ff;--muted:#a9a4cc;--line:#372d66;--accent:#b79cff;--accent-fg:#1a0f3d;--good:#7fe2a8;--good-bg:#143a27;--soft:#2a2158;--hero1:#1c0850;--hero2:#4c1fa8;--ink:#ffe27a;--shadow:0 6px 18px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:860px;margin-inline:auto;padding-inline:16px}
.hero{background:radial-gradient(900px 300px at 85% -10%,rgba(192,38,211,.55),transparent 60%),linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;padding-block:18px 56px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brandrow{display:flex;align-items:center;gap:12px}
.brandrow img{width:44px;height:44px;border-radius:10px;background:#fff;padding:3px;object-fit:contain;flex:none}
.brandrow span{font-weight:600;font-size:14px;line-height:1.25}
.back{color:#fff;font-weight:600;font-size:14px;text-decoration:none;opacity:.95}
.back:hover{text-decoration:underline}
.hero h1{margin:28px 0 8px;font-size:clamp(25px,5vw,36px);line-height:1.12;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--yellow)}
.hero p{margin:0;max-width:56ch;font-size:16px;opacity:.92}
main{margin-top:-30px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:13.5px;font-weight:600;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.search{margin-top:12px;width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg)}
.count{margin:14px 2px 4px;color:var(--muted);font-size:13.5px}
.month{margin:22px 0 8px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:64px 1fr;gap:4px 14px}
.date{grid-row:span 2;text-align:center;background:var(--soft);border-radius:12px;padding:8px 4px;align-self:start}
.date b{display:block;font-size:22px;line-height:1.1;color:var(--ink)}
.date span{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--soft);color:var(--accent)}
.new{background:var(--good-bg);color:var(--good)}
.src{font-size:12.5px;color:var(--muted)}
.title{margin:2px 0 0;font-size:16px;font-weight:600;color:var(--ink);line-height:1.35}
.sum{margin:2px 0 0;color:var(--muted);font-size:14px}
.pdf{grid-column:2;justify-self:start;margin-top:8px;display:inline-flex;gap:8px;align-items:center;font-weight:600;font-size:14px;text-decoration:none;background:var(--accent);color:var(--accent-fg);border-radius:10px;padding:8px 14px}
.pdf:hover{filter:brightness(1.1)}
.empty{margin-top:18px;text-align:center;padding:36px 20px;background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.empty a{color:var(--accent);font-weight:700}
.help{margin:28px 0 44px;color:var(--muted);font-size:14px;text-align:center}
.help a{color:var(--accent);font-weight:700}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
@media (max-width:480px){.item{grid-template-columns:1fr}.date{grid-row:auto;display:flex;gap:8px;align-items:baseline;justify-content:flex-start;text-align:left;padding:6px 10px}.date b{font-size:16px}.pdf{grid-column:1}}
</style></head><body>
<header class="hero"><div class="wrap">
 <div class="top"><div class="brandrow"><img alt="" src="/asmi-logo.png"><span>ASMI Youth Career Advisor</span></div><a class="back" href="/tools/neet-pg-cutoff">&larr; Cutoff explorer</a></div>
 <h1>NEET-PG <em>important updates</em></h1>
 <p>Every notice that matters for your counselling, date-wise, with the official PDF so you can read the source yourself.</p>
</div></header>

<main class="wrap">
 <section class="panel" aria-label="Filters">
  <div class="chips" id="chips" role="group" aria-label="Region"></div>
  <input class="search" id="q" type="search" placeholder="Search updates, e.g. round 2 schedule" autocomplete="off" aria-label="Search updates">
 </section>
 <div class="count" id="count" aria-live="polite"></div>
 <div id="out"></div>
 <p class="help">Questions about a notice? Call <a href="tel:7410019075">7410019075</a>.</p>
</main>

<script>
/* Data lives in /tools/updates/updates.json. Each entry:
   {"date":"2026-09-29","region":"all-india","title":"...","summary":"optional","source":"MCC","pdf":"/tools/updates/pdfs/file.pdf"}
   region is one of: all-india, maharashtra, karnataka, uttar-pradesh */
var REGIONS=[['all','All'],['all-india','All India'],['maharashtra','Maharashtra'],['karnataka','Karnataka'],['uttar-pradesh','Uttar Pradesh']];
var LABEL={};REGIONS.forEach(function(r){LABEL[r[0]]=r[1]});
var $=function(i){return document.getElementById(i)};
var DATA=[],region='all',term='';
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MONFULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
function parse(d){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null}
function safeUrl(u){u=String(u||'').trim();return (/^https?:\/\//i.test(u)||(u.charAt(0)==='/'&&u.charAt(1)!=='/'))?u:''}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}

function chips(){
 var h=$('chips');h.innerHTML='';
 REGIONS.forEach(function(r){
  var b=el('button','chip',r[1]);b.type='button';b.setAttribute('aria-pressed',r[0]===region);
  b.onclick=function(){region=r[0];chips();render()};h.appendChild(b)});
}
function render(){
 var out=$('out');out.innerHTML='';
 var t=term.toLowerCase(),now=new Date();now.setHours(0,0,0,0);
 var rows=DATA.filter(function(u){
  return (region==='all'||u.region===region)&&(!t||(u.title+' '+(u.summary||'')+' '+(u.source||'')+' '+(LABEL[u.region]||'')).toLowerCase().indexOf(t)>=0)});
 $('count').textContent=DATA.length?(rows.length+' of '+DATA.length+' updates'):'';
 if(!DATA.length){
  var e=el('div','empty');e.appendChild(el('b',null,'No updates published yet'));
  e.appendChild(document.createTextNode('We add official notices here as soon as they are released. Check back soon, or call '));
  var a=el('a',null,'7410019075');a.href='tel:7410019075';e.appendChild(a);e.appendChild(document.createTextNode('.'));out.appendChild(e);return}
 if(!rows.length){var n=el('div','empty');n.appendChild(el('b',null,'No updates match'));n.appendChild(document.createTextNode('Try another region or a different search.'));out.appendChild(n);return}
 var cur='',ul=null;
 rows.forEach(function(u){
  var d=parse(u.date),key=d?d.getFullYear()+'-'+d.getMonth():'x';
  if(key!==cur){cur=key;out.appendChild(el('h2','month',d?MONFULL[d.getMonth()]+' '+d.getFullYear():'Undated'));ul=el('ul','list');out.appendChild(ul)}
  var li=el('li','item'),dt=el('div','date');
  dt.appendChild(el('b',null,d?String(d.getDate()):'-'));dt.appendChild(el('span',null,d?MON[d.getMonth()]:''));li.appendChild(dt);
  var m=el('div','meta');m.appendChild(el('span','tag',LABEL[u.region]||u.region||''));
  if(d&&(now-d)/864e5<=7&&now>=d){m.appendChild(el('span','tag new','New'))}
  if(u.source)m.appendChild(el('span','src','Source: '+u.source));li.appendChild(m);
  var body=el('div');body.appendChild(el('p','title',u.title));if(u.summary)body.appendChild(el('p','sum',u.summary));
  li.appendChild(body);
  var url=safeUrl(u.pdf);
  if(url){var a=el('a','pdf','Official PDF');a.href=url;a.target='_blank';a.rel='noopener';a.appendChild(document.createTextNode(' ↗'));li.appendChild(a)}
  ul.appendChild(li)});
}
$('q').addEventListener('input',function(){term=this.value;render()});
chips();
fetch('/tools/updates/updates.json',{cache:'no-cache'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
 DATA=(j.updates||[]).filter(function(u){return u&&u.title}).sort(function(a,b){return (b.date||'').localeCompare(a.date||'')});render()
}).catch(function(){var o=$('out');o.innerHTML='';var e=el('div','empty');e.appendChild(el('b',null,'Could not load updates'));e.appendChild(document.createTextNode('Please refresh the page. If it keeps happening, call 7410019075.'));o.appendChild(e)});
</script>
</body></html>
