<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College details | MCC NEET UG 2026 | ASMI Career</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Montserrat:wght@400;500;600;700;800&display=swap');
  :root{
    --b1:#2a0a5e; --b2:#4a1a99; --b3:#6d3bd2; --brand:#5b21b6; --brand-dark:#1f0a52; --gold:#ffd700;
    --bg:#f4f2fb; --card:#fff; --line:#e7e2f3; --ink:#1d1530; --muted:#6c6483; --faint:#b9b3c8;
    --gov:#1f9d63; --deemed:#d19a00; --aiims:#6d3bd2; --jipmer:#d6366b; --cu:#2a6fd0;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Montserrat',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1560px;margin:0 auto;padding:0 22px}
  button{font-family:inherit}
  svg{flex:none}

  /* ---------- hero ---------- */
  .hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(105deg,var(--b1) 0%,var(--b2) 55%,#6a2fc4 100%)}
  .hero::before{content:"";position:absolute;inset:0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='900' height='160' viewBox='0 0 900 160'><polyline points='0,140 120,120 220,128 330,92 430,104 540,60 650,78 760,40 900,52' fill='none' stroke='white' stroke-opacity='.10' stroke-width='3'/><g fill='white' fill-opacity='.07'><rect x='640' y='86' width='14' height='60'/><rect x='670' y='66' width='14' height='80'/><rect x='700' y='96' width='14' height='50'/><path d='M760 150 V96 Q790 40 820 96 V150 Z'/></g></svg>") right bottom/auto 100% no-repeat;pointer-events:none}
  .hero-row{position:relative;display:flex;align-items:center;gap:22px;padding:22px;flex-wrap:wrap}
  .logo{height:84px;width:84px;background:#fff;border-radius:18px;padding:8px;object-fit:contain;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .hero h1{margin:0;font-size:2.15rem;font-weight:800;line-height:1.1}
  .hero h1 span{color:var(--gold)}
  .hero p{margin:5px 0 0;color:#e2d8f7;font-size:.95rem;font-weight:500}
  .hero p b{color:#fff}
  .source-card{margin-left:auto;background:rgba(255,255,255,.94);color:var(--ink);border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:center;max-width:340px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
  .source-card .helpline{font-size:.95rem;font-weight:700;margin-top:3px}
  .source-card .helpline a{color:var(--brand);text-decoration:none}
  .source-card .helpline a:hover{text-decoration:underline}
  .source-card small{display:block;font-size:.74rem;color:var(--muted);line-height:1.35;margin-top:2px}
  .source-card b{font-size:.86rem}

  /* ---------- stat cards ---------- */
  .stats{display:grid;grid-template-columns:1.1fr 1.2fr 1.1fr 1.1fr;gap:16px;margin:18px 0}
  .stat{border-radius:16px;padding:16px 20px;display:flex;align-items:center;gap:16px;min-height:96px}
  .stat .ico{width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
  .stat b{display:block;font-size:1.9rem;font-weight:800;line-height:1.05}
  .stat .l{font-size:1rem;font-weight:700}
  .stat .s{font-size:.82rem;font-weight:500;opacity:.85}
  .stat .badge{margin-left:auto;font-size:.72rem;font-weight:700;background:rgba(255,255,255,.22);border-radius:999px;padding:5px 12px;white-space:nowrap}
  .st-total{background:linear-gradient(120deg,#7c4ddd,#9c6cf0);color:#fff}
  .st-total .ico{background:rgba(255,255,255,.2)}
  .st-col{background:#e5eeff;color:#17418f}.st-col b{color:#1e5fd8}.st-col .ico{background:#2a6fd0}
  .st-mbbs{background:#dcf5e7;color:#0e5f38}.st-mbbs b{color:#12804a}.st-mbbs .ico{background:#1f9d63}
  .st-bds{background:#fde6ea;color:#8c1c3a}.st-bds b{color:#c8264a}.st-bds .ico{background:#e0405f}

  /* ---------- tabs / pills ---------- */
  .row-label{font-size:.7rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:0 0 8px}
  .pills{display:flex;gap:10px;flex-wrap:wrap}
  .round-tab{border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:11px 30px;font-size:.95rem;font-weight:700;border-radius:999px;cursor:pointer}
  .round-tab.active{background:linear-gradient(120deg,var(--b2),var(--b3));border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(182,93,33,.3)}
  .round-note{font-size:.8rem;color:var(--muted);margin:8px 0 14px}
  .notice{background:#fff8d6;border:1px solid #efd972;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.84rem;line-height:1.5}
  .type-tab{border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:10px 18px;border-radius:999px;font-size:.9rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:9px}
  .type-tab .count{font-size:.74rem;background:#efeaf9;color:var(--muted);border-radius:999px;padding:2px 9px;font-weight:700}
  .type-tab.active{background:var(--brand-dark);border-color:var(--brand-dark);color:#fff}
  .type-tab.active .count{background:rgba(255,255,255,.2);color:#fff}
  .type-tab svg{color:var(--c,var(--brand))}
  .type-tab.active svg{color:#fff}
  .bar{margin:0 0 14px}
  .quota-btn{border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:9px 18px;border-radius:999px;font-size:.86rem;font-weight:700;cursor:pointer;display:flex;gap:8px;align-items:center}
  .quota-btn .count{font-size:.72rem;background:#efeaf9;color:var(--muted);border-radius:999px;padding:1px 9px}
  .quota-btn.active{background:var(--gold);border-color:var(--gold);color:var(--brand-dark)}
  .quota-btn.active .count{background:rgba(82,39,10,.12);color:var(--brand-dark)}

  /* ---------- filter card ---------- */
  .filters{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;display:grid;grid-template-columns:repeat(12,1fr);gap:16px 18px;box-shadow:0 4px 18px rgba(94,44,10,.05)}
  .f{grid-column:span 12;min-width:0}
  .f.s3{grid-column:span 3}.f.s4{grid-column:span 4}.f.s5{grid-column:span 5}.f.s6{grid-column:span 6}.f.s2{grid-column:span 2}
  .f-title{display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:700;color:var(--ink);margin-bottom:8px}
  .f-title svg{color:var(--b3)}
  .f-title small{font-weight:500;color:var(--faint);font-size:.72rem}
  .seg{display:flex;flex-wrap:wrap;gap:6px}
  .seg button{border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:9px 15px;border-radius:10px;font-size:.85rem;font-weight:700;cursor:pointer}
  .seg button:hover{border-color:var(--b3)}
  .seg button.active{background:var(--brand);border-color:var(--brand);color:#fff}
  .seg.pwd button.active[data-v="yes"]{background:#b07900;border-color:#b07900}
  input[type=text]{font:500 .9rem 'Montserrat',system-ui,sans-serif;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
  input[type=text]:focus{outline:2px solid var(--b3);outline-offset:-1px}
  .searchbox{position:relative}
  .searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .searchbox input{padding-left:38px}
  .reset-btn{align-self:end;border:1.5px solid var(--b3);background:#fff;color:var(--brand);border-radius:10px;padding:10px 20px;font-size:.88rem;font-weight:700;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center;height:44px}
  .reset-btn:hover{background:#f3ecfb}

  .ms{position:relative}
  .ms-btn{width:100%;text-align:left;font:500 .9rem 'Montserrat',system-ui,sans-serif;padding:11px 32px 11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);cursor:pointer;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ms-btn::after{content:"▾";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .ms-btn.has{border-color:var(--b3);color:var(--brand);font-weight:700}
  .ms-panel{position:absolute;z-index:30;top:calc(100% + 4px);left:0;right:0;min-width:250px;background:#fff;border:1.5px solid var(--b3);border-radius:12px;box-shadow:0 12px 32px rgba(62,26,2,.2);padding:8px}
  .ms-panel[hidden]{display:none}
  .ms-search{padding:9px 10px !important;font-size:.85rem !important}
  .ms-list{max-height:260px;overflow:auto;margin:8px 0 4px}
  .ms-list label{display:flex;align-items:center;gap:8px;padding:7px 6px;border-radius:6px;font-size:.85rem;font-weight:500;cursor:pointer}
  .ms-list label:hover{background:#f3ecfb}
  .ms-list input{width:auto;accent-color:var(--brand)}
  .ms-foot{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:6px}
  .ms-foot button{background:none;border:none;color:var(--brand);font-size:.8rem;font-weight:700;cursor:pointer;padding:4px 6px}
  .ms-empty{padding:10px;color:var(--muted);font-size:.82rem}

  /* ---------- result line ---------- */
  .result-line{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:6px 2px 10px}
  .result-line .big{font-size:1.5rem;font-weight:800}
  .result-line .txt{font-size:1rem;font-weight:600;color:var(--ink)}
  .result-line .hint{margin-left:auto;font-size:.82rem;color:var(--muted)}
  .mode-banner{display:none;background:#fff0c2;border:1px solid #ecd27a;color:#6b4e00;border-radius:10px;padding:8px 14px;font-size:.84rem;font-weight:700;margin-bottom:10px}

  /* ---------- table ---------- */
  .table-wrap{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:auto;max-height:78vh;box-shadow:0 4px 18px rgba(94,44,10,.05)}
  table{border-collapse:separate;border-spacing:0;width:100%;min-width:1280px}
  thead th{position:sticky;top:0;z-index:3;background:linear-gradient(180deg,#3b1585,#2f0f6e);color:#fff;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;padding:13px 10px;text-align:left;white-space:nowrap;cursor:pointer;user-select:none;font-weight:800}
  thead th small{display:block;text-transform:none;letter-spacing:0;font-weight:500;color:#cdbfee;font-size:.7rem;margin-top:2px}
  thead th.num{text-align:center}
  thead th.nosort{cursor:default}
  thead th.sorted::after{content:" ▾";color:var(--gold)}
  thead th.sorted.asc::after{content:" ▴";color:var(--gold)}
  thead th.idx{left:0;z-index:5;text-align:center;width:48px;min-width:48px}
  thead th.college{left:48px;z-index:5}
  tbody td{padding:12px 10px;border-bottom:1px solid var(--line);font-size:.87rem;vertical-align:middle;background:#fff}
  tbody tr:nth-child(even) td{background:#faf8fe}
  tbody tr:hover td{background:#f1ebfc}
  td.idx{position:sticky;left:0;z-index:2;text-align:center;width:48px;min-width:48px;color:var(--muted);font-weight:600}
  td.college{min-width:310px;max-width:390px;position:sticky;left:48px;z-index:2;box-shadow:1px 0 0 var(--line)}
  .cname{font-weight:700;line-height:1.35}
  .cstate{font-size:.78rem;color:var(--muted);margin-top:3px}
  .type-chip{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;color:#fff;padding:5px 12px;border-radius:999px;white-space:nowrap}
  td.est{text-align:center;font-weight:600;color:var(--muted)}
  td.fee{white-space:nowrap;font-weight:700;color:var(--brand-dark);text-align:right}
  td.nrifee{white-space:nowrap;font-weight:700;text-align:right;color:#4a1a7e}
  td.n{text-align:center;font-weight:700;font-size:.97rem}
  td.n.zero{color:var(--faint);font-weight:500}
  td.n.hl{background:#fff4b8 !important}
  td.n.nri{color:#4a1a7e;background:#f4eeff !important}
  thead th.nri{background:#4a1a7e}
  td.total{text-align:center;font-weight:800;font-size:1.05rem;color:var(--brand);background:#f1eafc !important;border-left:2px solid var(--line)}
  td.quota{font-size:.82rem;max-width:200px}
  td.act{text-align:center;white-space:nowrap}
  .view-btn{border:1.5px solid var(--b3);background:#fff;color:var(--brand);border-radius:10px;padding:8px 14px;font-size:.8rem;font-weight:700;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
  .view-btn:hover{background:#f3ecfb}
  .hide-nri .nricol{display:none}
  .none{color:var(--faint)}
  .tag{display:inline-block;margin-left:6px;font-size:.62rem;font-weight:800;padding:2px 6px;border-radius:5px;vertical-align:middle}
  .tag.added{background:#dff5e8;color:#14663f}
  .tag.female{background:#fbe4ee;color:#8a1c4a}
  .empty{padding:50px;text-align:center;color:var(--muted);font-weight:600}

  /* ---------- details modal ---------- */
  .modal{position:fixed;inset:0;background:rgba(50,24,6,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:5vh 14px;overflow:auto}
  .modal[hidden]{display:none}
  .modal-card{background:#fff;border-radius:18px;max-width:900px;width:100%;padding:22px 24px;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.35)}
  .modal-x{position:absolute;right:14px;top:10px;border:none;background:none;font-size:1.8rem;line-height:1;cursor:pointer;color:var(--muted)}
  .modal h2{margin:0 40px 4px 0;font-size:1.3rem}
  .modal .meta{display:flex;gap:10px 18px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin:8px 0 16px;align-items:center}
  .modal .meta b{color:var(--ink)}
  .modal table{min-width:0;font-size:.85rem}
  .modal thead th{position:static;cursor:default;font-size:.7rem}
  .modal-note{font-size:.76rem;color:var(--muted);margin-top:12px}

  footer{margin:18px 0 44px;font-size:.78rem;color:var(--muted);line-height:1.65}

  @media(max-width:1100px){.stats{grid-template-columns:1fr 1fr}.f.s2,.f.s3,.f.s4,.f.s5,.f.s6{grid-column:span 6}.source-card{margin-left:0}}
  /* ---------- mobile ---------- */
  .m-only{display:none}
  .cards{display:none}
  .mcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(94,44,10,.05)}
  .mc-head{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
  .mc-name{min-width:0}
  .mc-total{flex:none;text-align:center;background:#f1eafc;border-radius:12px;padding:6px 12px;min-width:62px}
  .mc-total b{display:block;font-size:1.25rem;font-weight:800;color:var(--brand);line-height:1.1}
  .mc-total span{font-size:.62rem;font-weight:700;color:var(--muted);text-transform:uppercase}
  .mc-facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin:12px 0 4px;font-size:.88rem;font-weight:700}
  .mc-facts i,.mc-cat i{display:block;font-style:normal;font-size:.62rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px}
  .mc-quota{font-size:.8rem;color:var(--muted);font-weight:600;margin:6px 0 10px}
  .mc-cats{display:grid;gap:6px;margin:10px 0 12px}
  .mc-cat{text-align:center;background:#faf8fe;border:1px solid var(--line);border-radius:10px;padding:7px 2px}
  .mc-cat b{display:block;font-size:1.05rem;font-weight:800;color:var(--brand-dark)}
  .mc-cat small{display:block;font-size:.62rem;color:var(--muted);font-weight:600}
  .mc-cat.zero b{color:var(--faint);font-weight:500}
  .mc-cat.hl{background:#fff4b8;border-color:#e6cf55}
  .mc-cat.nri{background:#f4eeff}
  .mcard .view-btn{width:100%;justify-content:center;padding:11px}
  .filter-toggle{width:100%;margin-top:10px;border:1.5px solid var(--b3);background:#fff;color:var(--brand);border-radius:10px;padding:11px;font:700 .9rem 'Montserrat',system-ui,sans-serif;cursor:pointer;align-items:center;justify-content:center;gap:8px}
  .filters.open .filter-toggle{margin-bottom:16px}
  .f-title:empty{min-height:20px}
  .filter-toggle .fc{background:var(--brand);color:#fff;border-radius:999px;font-size:.72rem;padding:1px 8px}
  .m-sort{width:100%;font:600 .9rem 'Montserrat',system-ui,sans-serif;padding:11px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  @media(max-width:760px){
    body{overflow-x:hidden}
    .m-only{display:block}
    .filter-toggle.m-only{display:flex}
    .wrap{padding:0 12px}
    .hero-row{padding:14px 12px;gap:12px}
    .logo{height:52px;width:52px;border-radius:12px;padding:5px}
    .hero h1{font-size:1.3rem}
    .hero p{font-size:.82rem;margin-top:3px}
    .source-card{width:100%;max-width:none;margin-left:0;padding:10px 14px}
    .stats{grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
    .stat{padding:12px;min-height:0;gap:10px}
    .stat .ico{width:38px;height:38px;border-radius:11px}
    .stat .ico svg{width:20px;height:20px}
    .stat b{font-size:1.3rem}
    .stat .l{font-size:.8rem}
    .stat .s{font-size:.7rem}
    .stat .badge{display:none}
    .pills{flex-wrap:nowrap;overflow-x:auto;margin-left:-12px;margin-right:-12px;padding:2px 12px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .pills::-webkit-scrollbar{display:none}
    .pills>*{flex:none;white-space:nowrap}
    .round-tab{padding:10px 18px;font-size:.88rem}
    .type-tab{padding:9px 14px;font-size:.84rem}
    .quota-btn{padding:9px 14px;font-size:.82rem}
    .filters{display:block;padding:12px;border-radius:14px}
    .filters .f{grid-column:1/-1 !important;margin-bottom:16px}
    .filters:not(.open) .f:not(.f-search){display:none}
    .filters .f.f-search{margin-bottom:0}
    .filters.open .f.f-search{margin-bottom:16px}
    input[type=text],.ms-btn,.ms-search{font-size:16px !important}
    .seg button{padding:10px 14px}
    .reset-btn{height:46px}
    .result-line{gap:6px 8px}
    .result-line .big{font-size:1.25rem}
    .result-line .txt{font-size:.9rem}
    .result-line .hint{display:none}
    .result-line .m-sort{order:4;flex:1 1 100%}
    .table-wrap{display:none}
    .cards{display:block}
    .modal{padding:0;align-items:flex-end}
    .modal-card{max-width:none;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 14px 24px}
    .modal h2{font-size:1.1rem}
    .modal table{min-width:520px}
    .f-title:empty{display:none}
    .modal table.mt-seat,.modal table.mt-cut,.modal .mt-seat tbody,.modal .mt-cut tbody{display:block;min-width:0 !important;width:100%}
    .modal .mt-seat thead,.modal .mt-cut thead{display:none}
    .modal .mt-seat tr,.modal .mt-cut tr{display:grid;gap:8px 6px;background:#faf8fe;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
    .modal .mt-seat tr{grid-template-columns:repeat(10,1fr)}
    .modal .mt-cut tr{grid-template-columns:1fr 1fr}
    .modal .mt-seat td,.modal .mt-cut td{display:block;padding:0;border:none;background:none !important;text-align:center;font-size:.9rem;box-shadow:none}
    .modal .mt-seat td[data-label]::before,.modal .mt-cut td[data-label]::before{content:attr(data-label);display:block;font-size:.58rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:1px}
    .modal .mt-seat td:nth-child(1){grid-column:1/-1;text-align:left;font-weight:700}
    .modal .mt-seat td:nth-child(2){grid-column:1/-1;text-align:left !important}
    .modal .mt-seat td:nth-child(n+3):nth-child(-n+7){grid-column:span 2}
    .modal .mt-seat td:nth-child(8),.modal .mt-seat td:nth-child(9){grid-column:span 4;border-top:1px dashed var(--line);padding-top:6px}
    .modal .mt-seat td:nth-child(10){grid-column:1/-1;text-align:left;border-top:1px dashed var(--line);padding-top:6px}
    .modal .mt-seat td.total{border-left:none}
    .modal .mt-cut td:nth-child(1){grid-column:1/-1;text-align:left;font-size:1rem}
    footer{font-size:.74rem}
  }
  .hero-row{padding:14px 22px}
  .hero .back{display:inline-flex;align-items:center;gap:8px;color:#fff;text-decoration:none;font-weight:700;font-size:.9rem;background:rgba(255,255,255,.14);border-radius:999px;padding:8px 16px}
  .hero .back:hover{background:rgba(255,255,255,.24)}
  .hero .spacer{flex:1}
  .page{padding:18px 0 40px}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 4px 18px rgba(94,44,10,.05)}
  .card h2{margin:0 0 12px;font-size:1.1rem;font-weight:800;display:flex;align-items:center;gap:8px}
  .card h2 small{font-weight:600;color:var(--muted);font-size:.78rem}
  .college-head h1{margin:0 0 8px;font-size:1.7rem;line-height:1.2}
  .chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 4px}
  .chip2{display:inline-flex;align-items:center;gap:6px;background:#f1eafc;color:var(--brand);font-weight:700;font-size:.8rem;padding:5px 12px;border-radius:999px}
  .where{color:var(--muted);font-weight:600;font-size:.95rem}
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
  .fact{background:#faf8fe;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .fact i{display:block;font-style:normal;font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:3px}
  .fact b{font-size:1.2rem;font-weight:800;color:var(--brand-dark)}
  .fact small{display:block;font-size:.72rem;color:var(--muted);font-weight:600;margin-top:2px}
  .airrow{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
  .airrow .f{flex:1 1 220px}
  .verdict{margin-top:14px;border-radius:14px;padding:14px 16px;font-weight:600;line-height:1.5;display:none}
  .verdict b{font-weight:800}
  .v-safe{background:#e8f8ef;border:1px solid #9bd7b6}.v-likely{background:#eaf2ff;border:1px solid #a9c6f3}.v-border{background:#fff5dc;border:1px solid #ecd18a}.v-out{background:#f1f0f6;border:1px solid #d6d2e2}
  table.ct{width:100%;min-width:0;border-collapse:collapse}
  table.ct th{background:linear-gradient(180deg,#3b1585,#2f0f6e);color:#fff;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;padding:12px 10px;text-align:center}
  table.ct th:first-child{text-align:left;border-top-left-radius:12px}
  table.ct th:last-child{border-top-right-radius:12px}
  table.ct td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:center}
  table.ct td:first-child{text-align:left;font-weight:700}
  table.ct tr.sel td:first-child{color:var(--brand)}
  table.ct tr.sel td{background:#fbf9ff}
  .rank-cell b{display:block;font-size:1.05rem;font-weight:800;color:var(--brand-dark)}
  .rank-cell small{display:block;font-size:.7rem;color:var(--muted);font-weight:600}
  .rank-cell.none{color:var(--faint)}
  td.rank-cell.ch-safe{background:#eefaf3 !important}td.rank-cell.ch-likely{background:#eef4ff !important}td.rank-cell.ch-border{background:#fff8e6 !important}td.rank-cell.ch-out{background:#f4f3f8 !important}
  .scroll{overflow:auto;border:1px solid var(--line);border-radius:12px}
  .qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-top:14px}
  .qcard{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
  .qcard h3{margin:0 0 4px;font-size:.95rem}
  .qcard .qt{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .qcard .qtotal{background:#f1eafc;border-radius:12px;padding:5px 12px;text-align:center;min-width:60px}
  .qcard .qtotal b{display:block;font-size:1.15rem;color:var(--brand);line-height:1.1}
  .qcard .qtotal span{font-size:.6rem;font-weight:700;text-transform:uppercase;color:var(--muted)}
  .qcard .mc-cats{margin:12px 0 4px}
  .qcard .pwdline{font-size:.8rem;color:#6b4e00;background:#fff0c2;border-radius:8px;padding:5px 10px;margin-top:8px;display:inline-block;font-weight:700}
  .qcard .qfee{font-size:.8rem;color:var(--muted);font-weight:600;margin-top:6px}
  dl.about{display:grid;grid-template-columns:150px 1fr;gap:8px 16px;margin:0}
  dl.about dt{font-weight:800;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
  dl.about dd{margin:0;font-weight:600}
  .cta{background:linear-gradient(120deg,var(--b2),var(--b3));color:#fff;border-radius:18px;padding:22px;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .cta h2{margin:0 0 4px;font-size:1.15rem;color:#fff}
  .cta p{margin:0;opacity:.9;font-size:.88rem}
  .cta .btns{display:flex;gap:10px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;border-radius:12px;padding:12px 18px;font-weight:800;font-size:.9rem;text-decoration:none;border:none;cursor:pointer;font-family:inherit}
  .btn.gold{background:var(--gold);color:var(--brand-dark)}
  .btn.light{background:rgba(255,255,255,.18);color:#fff;border:1.5px solid rgba(255,255,255,.5)}
  .btn.out{background:#fff;color:var(--brand);border:1.5px solid var(--b3)}
  .sharebar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .err{padding:60px 20px;text-align:center;color:var(--muted);font-weight:600}
  .note{font-size:.76rem;color:var(--muted);line-height:1.6;margin-top:10px}
  @media(max-width:760px){
    .page{padding-top:12px}.card{padding:14px;border-radius:16px}
    .college-head h1{font-size:1.3rem}
    .facts{grid-template-columns:1fr 1fr}
    dl.about{grid-template-columns:1fr;gap:2px}dl.about dd{margin-bottom:10px}
    .qgrid{grid-template-columns:1fr}
    .cta{padding:16px}.cta .btns{width:100%}.cta .btn{flex:1 1 100%;justify-content:center}
    .hero .back{padding:7px 14px}
    table.ct td,table.ct th{padding:10px 4px}
    table.ct th{font-size:.62rem}
  }
  /* ---------- ASMI purple banner, yellow accents ---------- */
  :root{--b1:#2a0a5e;--b2:#410775;--b3:#50098a;--brand:#50098a;--brand-dark:#2c0450;--gold:#ffd700;--bg:#f4f1fb}
  .hero{background:linear-gradient(105deg,#240652 0%,#410775 48%,#50098a 100%);color:#fff}
  .hero h1,.hero h1 span{color:#fff}.hero h1 span{color:#ffd700}
  .hero p,.hero p b{color:#efe4ff}
  .hero::before{opacity:1}
  thead th{background:linear-gradient(180deg,#4a1a99,#2f0a68);color:#fff}
  thead th small{color:#d9c6ff}
  thead th.cat{background:#3a0f80;color:#fff}
  thead th.round{background:linear-gradient(180deg,#5a22ad,#3a0f80);color:#fff}
  thead th.nri{background:#2c0450;color:#ffd700}
  thead th.sorted{box-shadow:inset 0 -3px 0 #ffd700}
  .st-total{background:linear-gradient(120deg,#410775,#50098a);color:#fff}.st-total .badge{background:#ffd700;color:#2c0450}.st-total .ico{background:rgba(255,255,255,.18)}
  .st-col{background:#ffd700;color:#2c0450}.st-col b{color:#2c0450}.st-col .ico{background:#410775}.st-col .ico svg{stroke:#fff}
  .round-tab.active{background:linear-gradient(120deg,#ffd700,#ffb800);color:#2c0450;border-color:#ffb800;box-shadow:0 6px 16px rgba(255,184,0,.4)}
  .type-tab.active{background:linear-gradient(120deg,#ffd700,#ffb800);border-color:#ffb800;color:#2c0450}
  .type-tab.active .count{background:#410775;color:#ffd700}
  .seg button.active{background:#410775;border-color:#410775;color:#fff}
  .ms-btn.has{border-color:#50098a;box-shadow:0 0 0 2px rgba(255,215,0,.7)}
  .btn:not(.out){background:linear-gradient(120deg,#ffd700,#ffb800);color:#2c0450;border:0}
  .hero .back{color:#fff;background:rgba(255,255,255,.14)}.hero .back:hover{background:rgba(255,255,255,.24)}
  .logo{height:128px;width:auto;max-width:190px;border-radius:20px;padding:10px 14px}
  @media(max-width:760px){.logo{height:84px;max-width:128px;border-radius:14px;padding:7px 10px}}
  .qchip{display:inline-block;background:#ffd700;color:#2c0450;border-radius:6px;padding:1px 7px;font-weight:700;font-size:.72rem}
  table.ct th{background:linear-gradient(180deg,#4a1a99,#2f0a68);color:#fff}
  .rank-cell,.rank-cell b,.rank-cell small{font-family:'Inter',system-ui,sans-serif;font-variant-numeric:tabular-nums lining-nums}
  .rank-cell small.op{color:#6d3bd2;font-weight:600}
  .rank-cell.open b{font-weight:600;color:#4a1a99}
  .rank-cell.open.none{color:var(--faint)}
</style>
</head>
<body>

<div class="hero">
  <div class="wrap hero-row">
    <a class="back" id="back" href="/mcc-cutoff.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Back to cutoffs</a>
    <div class="spacer"></div>
    <div class="source-card" style="margin-left:0">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#50098a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
      <div><b>ASMI Helpline</b><small class="helpline"><a href="tel:+917410019074">7410019074</a> / <a href="tel:+917410019075">75</a> / <a href="tel:+917410019076">76</a> / <a href="tel:+917410019077">77</a></small></div>
    </div>
  </div>
</div>

<div class="wrap page" id="page"><div class="err">Loading college details…</div></div>

<script>
const $=id=>document.getElementById(id);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>n==null?null:Number(n).toLocaleString("en-IN");
const TYPE_OF={GOVT:"Government",AIIMS:"AIIMS",JIPMER:"JIPMER",CENTRAL:"Central University",DEEMED:"Deemed University"};
const TYPE_COLORS={"Government":"#1f9d63","Deemed University":"#d19a00","AIIMS":"#0f766e","JIPMER":"#d6366b","Central University":"#2a6fd0"};
const STATE_ALIAS={"Tamilnadu":"Tamil Nadu","Jammu and Kashmir":"Jammu And Kashmir","Pondicherry":"Puducherry","Andaman Nicobar":"Andaman And Nicobar Islands","Dadra and Nagar Haveli":"The Dadra And Nagar Haveli And Daman And Diu"};
const ROUNDS=["Round 1","Round 2","Round 3","Stray Vacancy Round"];
const RLABEL=r=>r==="Stray Vacancy Round"?"Stray":r;
let OTHERS=[];
const ALL_TYPES=["GOVT_MBBS","GOVT_BDS","AIIMS_MBBS","JIPMER_MBBS","CENTRAL_MBBS","CENTRAL_BDS","DEEMED_MBBS","DEEMED_BDS"];
const CATS=[["OPEN","General"],["OBC","OBC"],["EWS","EWS"],["SC","SC"],["ST","ST"],["NRI","NRI"],["MINORITY","Minority (All)"],["MINORITY_MUSLIM","Muslim Minority"],["MINORITY_JAIN","Jain Minority"],["WOMEN","Women"]];
const CAT_LABEL=Object.fromEntries(CATS);
const CH_LABEL={safe:"Safe",likely:"Likely",border:"Borderline",out:"Out of reach"};
const normCat=c=>/^NRI_P/.test(c)?"NRI":c;
// NRI is one category: the P-I / P-II files are merged (the closing rank is the larger of the two)
function mergeRounds(a,b){
  if(!a) return b; if(!b) return a;
  const out={};
  for(const r of new Set([...Object.keys(a),...Object.keys(b)])){
    const x=a[r]||{},y=b[r]||{},m=(p,q)=>p==null?q:q==null?p:Math.max(p,q),mn=(p,q)=>p==null?q:q==null?p:Math.min(p,q);
    out[r]={Intake:(x.Intake==null&&y.Intake==null)?null:(x.Intake||0)+(y.Intake||0),AIR:m(x.AIR,y.AIR),AIR_PWD:m(x.AIR_PWD,y.AIR_PWD),OPEN_AIR:mn(x.OPEN_AIR,y.OPEN_AIR),OPEN_AIR_PWD:mn(x.OPEN_AIR_PWD,y.OPEN_AIR_PWD)};
  }
  return out;
}

const chance=(R,v)=>R==null||v==null?null:R<=v*0.88?"safe":R<=v?"likely":R<=v*1.12?"border":"out";

const q=new URLSearchParams(location.search);
const CODE=q.get("c"), COURSE_Q=q.get("co"), QUOTA_Q=q.get("q")||"";
const ITYPE=q.get("t")==="OTHER"?(COURSE_Q==="BDS"?"OTHER_BDS":"OTHER_MBBS"):q.get("t");
const CA=/^NRI/.test(q.get("ca")||"")?"NRI":q.get("ca");   // older links used NRI1 / NRI2
const S={cat:CATS.some(c=>c[0]===CA)?CA:"OPEN",pwd:q.get("pw")==="yes"?"yes":"no",rank:parseInt(q.get("rk"))||null};
let C=null;

// Back goes to the list with its filters (browser Back keeps them); fall back to the plain list
$("back").onclick=e=>{if(document.referrer&&new URL(document.referrer).origin===location.origin&&history.length>1){e.preventDefault();history.back();}};

const rankOf=rd=>rd?(S.pwd==="yes"?rd.AIR_PWD:rd.AIR):null;
const feeNum=v=>{const n=parseInt(String(v==null?"":v).replace(/\D/g,""));return n||0;};

async function load(){
  if(!CODE||!ITYPE||!/^[A-Z]+_(MBBS|BDS)$/.test(ITYPE)||!/^\d+$/.test(CODE)){return fail("This link is missing the college details. Please open a college from the cutoff list.");}
  try{
    const index=await fetch("/data/cutoffs/MCC/2026/college-index.json").then(r=>r.ok?r.json():{}).catch(()=>({}));
    OTHERS=((await fetch("/data/cutoffs/MCC/2026/OTHER_QUOTA/all.json").then(r=>r.ok?r.json():{entries:[]}).catch(()=>({entries:[]}))).entries||[]).filter(e=>e.code===CODE);
    // the link says which file the college is in; if not there (e.g. a Delhi college typed differently in the seat matrix) try the other files of the same course
    const course=ITYPE.split("_")[1];
    const order=[ITYPE,...ALL_TYPES.filter(t=>t!==ITYPE&&t.endsWith("_"+course))];
    let o=null;
    if(/^OTHER_/.test(ITYPE)){
      const e=OTHERS.find(x=>x.course===course&&x.quota===QUOTA_Q)||OTHERS.find(x=>x.course===course);
      if(e) o={code:e.code,name:e.name,state:STATE_ALIAS[e.state]||e.state,est:e.establishment,fees:e.fees,type:e.type,course,quota:e.quota,cats:e.cats,nriFee:null};
    }
    else for(const it of order){
      const file=await fetch(`/data/cutoffs/MCC/2026/${it}/all.json`).then(r=>{if(!r.ok)throw 0;return r.json();});
      const [prefix]=file.institution_type.split("_");
      Object.entries(file.categories).forEach(([cat,list])=>list.forEach(c=>{
        if(c.code!==CODE) return;
        if(!o) o={code:c.code,name:c.name,state:STATE_ALIAS[c.state]||c.state,est:c.establishment,fees:c.fees,type:TYPE_OF[prefix],course,cats:{},nriFee:null};
        const nc=normCat(cat); o.cats[nc]=nc==="NRI"?mergeRounds(o.cats[nc],c.rounds):c.rounds;
        if(typeof c.fees==="string"&&c.fees.trim().startsWith("$")) o.nriFee=c.fees.trim(); else if(!feeNum(o.fees)&&feeNum(c.fees)) o.fees=c.fees;
      }));
      if(o) break;
    }
    if(!o) return fail("We could not find this college in the cutoff data.");
    const ix=index[CODE]||{}; o.city=ix.city||""; o.district=ix.district||""; o.address=ix.address||"";
    if(!o.quota) o.quota={GOVT:"All India Quota",AIIMS:"Open Seat Quota",JIPMER:"Open Seat Quota",CENTRAL:"Open Seat Quota",DEEMED:"Self Financed Merit Seat"}[ITYPE.split("_")[0]]||"";
    C=o;
  }catch(e){return fail("Could not load the college details. Please refresh the page.");}
  if(!C.cats[S.cat]) S.cat="OPEN";
  if(!C.cats[S.cat]) S.cat=Object.keys(C.cats)[0];
  document.title=`${C.name} | Cutoff & seats 2026 | ASMI Career`;
  draw();
}
function fail(msg){$("page").innerHTML=`<div class="card err">${esc(msg)}<div style="margin-top:16px"><a class="btn out" href="/mcc-cutoff.html">Go to cutoff list</a></div></div>`;}

const hasAny=k=>ROUNDS.some(r=>{const d=C.cats[k]&&C.cats[k][r];return d&&(d.AIR!=null||d.AIR_PWD!=null);});
const availCats=()=>CATS.filter(([k])=>C.cats[k]&&hasAny(k));
function latest(cat){const e=C.cats[cat];for(const r of ["Stray Vacancy Round","Round 3","Round 2","Round 1"]){const v=rankOf(e&&e[r]);if(v!=null)return {v,r};}return null;}

const ctSubText=()=>"Closing All India Rank"+(/^OTHER_/.test(ITYPE)&&C.quota!=="All India Quota"?" · "+C.quota:"")+(S.pwd==="yes"?" (PwD)":"");
function feeLine(){
  const f=feeNum(C.fees);
  return f?"₹"+f.toLocaleString("en-IN"):'<span class="none">—</span>';
}

function draw(){
  const gen=C.cats.OPEN; const lg=latest("OPEN");
  const seatsNow=lg&&gen&&gen[lg.r]&&gen[lg.r].Intake;
  const cats=availCats();
  $("page").innerHTML=`
  <section class="card college-head">
    <h1>${esc(C.name)}</h1>
    <div class="chips"><span class="type-chip" style="background:${TYPE_COLORS[C.type]||"#50098a"}">${esc(C.type)}</span><span class="chip2">${esc(C.course)}</span>${C.est?`<span class="chip2">Est. ${C.est}</span>`:""}</div>
    <div class="where">${esc(C.state)}${C.district?" · "+esc(C.district):""}</div>
    <div class="facts">
      <div class="fact"><i>Fees Per Year</i><b>${feeLine()}</b><small>As per ASMI fee list</small></div>
      ${C.nriFee?`<div class="fact"><i>NRI quota fee</i><b>${esc(C.nriFee)}</b><small>Per year (USD)</small></div>`:""}
      <div class="fact"><i>Established</i><b>${C.est||"—"}</b></div>
      <div class="fact"><i>MCC code</i><b>${esc(C.code)}</b></div>
      ${lg?`<div class="fact"><i>General closing AIR</i><b>${fmt(lg.v)}</b><small>${RLABEL(lg.r)}${seatsNow?` · ${seatsNow} seat${seatsNow>1?"s":""}`:""}</small></div>`:""}
    </div>
    <div class="sharebar">
      <a class="btn out" id="wa" target="_blank" rel="noopener">Share on WhatsApp</a>
      <button class="btn out" id="copy" type="button">Copy Link</button>
    </div>
  </section>

  <section class="card">
    <h2>Check Your Chances <small>Compares your NEET AIR with the latest closing rank</small></h2>
    <div class="airrow">
      <div class="f"><div class="f-title">Your NEET AIR</div><input id="rank" type="text" inputmode="numeric" placeholder="e.g. 15000" autocomplete="off" value="${S.rank||""}"></div>
      <div class="f"><div class="f-title">Category</div><div class="seg" id="catSeg"></div></div>
      <div class="f" style="flex:0 0 auto"><div class="f-title">PwD</div><div class="seg pwd" id="pwdSeg"></div></div>
    </div>
    <div class="verdict" id="verdict"></div>
  </section>

  <section class="card">
    <h2>Cutoff, Round by Round <small id="ctSub">${ctSubText()}</small></h2>
    <div class="scroll"><table class="ct"><thead><tr><th>Category</th>${ROUNDS.map(r=>`<th>${RLABEL(r)}<small style="display:block;font-weight:600;opacity:.8">Opening AIR</small></th><th>${RLABEL(r)}<small style="display:block;font-weight:600;opacity:.8">Closing AIR</small></th>`).join("")}</tr></thead><tbody id="ctBody"></tbody></table></div>
    <p class="note">Closing rank = the last candidate freshly allotted (or upgraded) a seat in that round; retained seats do not set it. Smaller rank = harder to get. "n seats" is the number of seats offered in that round (MCC seat matrix). A dash means nobody was freshly allotted in that round.</p>
  </section>

  ${(()=>{const oth=OTHERS.filter(x=>x.course===C.course&&x.quota!==C.quota);return oth.length?`<section class="card"><h2>Other Quotas At This College <small>Cutoffs For Other Seat Quotas</small></h2><div class="chips">${oth.map(x=>`<a class="chip2" style="text-decoration:none" href="/mcc-college.html?c=${encodeURIComponent(x.code)}&t=OTHER&co=${x.course}&q=${encodeURIComponent(x.quota)}">${esc(x.quota)}</a>`).join("")}</div></section>`:""})()}
  <section class="card">
    <h2>About this college</h2>
    <dl class="about">
      <dt>College</dt><dd>${esc(C.name)}</dd>
      <dt>Type</dt><dd>${esc(C.type)} · ${esc(C.course)}</dd>
      <dt>State</dt><dd>${esc(C.state)}</dd>
      ${C.district?`<dt>District</dt><dd>${esc(C.district)}</dd>`:""}${C.city&&C.city!==C.district?`<dt>City / Town</dt><dd>${esc(C.city)}</dd>`:""}
      ${C.est?`<dt>Established</dt><dd>${C.est}</dd>`:""}
      <dt>Annual fee</dt><dd>${feeLine()}${C.nriFee?` &nbsp;·&nbsp; NRI quota ${esc(C.nriFee)}`:""}</dd>
      <dt>MCC code</dt><dd>${esc(C.code)}</dd>
      ${C.address?`<dt>Address (as listed by MCC)</dt><dd>${esc(C.address)}</dd>`:""}
    </dl>
    <p class="note">Fees are as per ASMI's fee list and can change; confirm with the college at the time of admission. District is added by ASMI (it is not part of the MCC data).</p>
  </section>

  <section class="cta">
    <div><h2>Need help choosing the right college?</h2><p>Talk to an ASMI counsellor about choice filling, documents and the next rounds.</p></div>
    <div class="btns"><a class="btn gold" href="tel:+917410019074">Call 7410019074</a><a class="btn light" href="tel:+917410019075">7410019075</a></div>
  </section>`;
  const url=location.href;
  $("wa").href="https://wa.me/?text="+encodeURIComponent(`${C.name} – NEET UG 2026 cutoff and seats on ASMI Career: ${url}`);
  $("copy").onclick=async()=>{try{await navigator.clipboard.writeText(url);$("copy").textContent="Link copied ✓";}catch(e){$("copy").textContent="Copy failed";}setTimeout(()=>$("copy").textContent="Copy Link",1800);};
  const seg=(id,items,key,onc)=>{const el=$(id);el.innerHTML=items.map(([v,l])=>`<button type="button" data-v="${esc(v)}" class="${S[key]===v?"active":""}">${esc(l)}</button>`).join("");el.querySelectorAll("button").forEach(b=>b.onclick=()=>{S[key]=b.dataset.v;el.querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===b));onc();});};
  seg("catSeg",cats.map(([k,l])=>[k,l]),"cat",refresh);
  seg("pwdSeg",[["no","No"],["yes","Yes"]],"pwd",refresh);
  $("rank").addEventListener("input",e=>{e.target.value=e.target.value.replace(/\D/g,"").slice(0,8);S.rank=parseInt(e.target.value)||null;refresh();});
  refresh();
}

function refresh(){
  const R=S.rank;
  // cutoff table
  $("ctBody").innerHTML=availCats().map(([k,l])=>{
    const e=C.cats[k];
    return `<tr class="${k===S.cat?"sel":""}"><td>${esc(l)}</td>${ROUNDS.map(r=>{
      const rd=e[r], v=rankOf(rd), opn=S.pwd==="yes"?rd.OPEN_AIR_PWD:rd.OPEN_AIR;
      const open=opn!=null?`<td class="rank-cell open"><b>${fmt(opn)}</b></td>`:'<td class="rank-cell open none">—</td>';
      const seats=rd&&rd.Intake?`<small>${rd.Intake} seat${rd.Intake>1?"s":""}</small>`:"";
      if(v==null) return open+`<td class="rank-cell none" title="Seats offered in this round, nobody new allotted.">—${seats}</td>`;
      const ch=k===S.cat?chance(R,v):null;
      return open+`<td class="rank-cell${ch?" ch-"+ch:""}"><b>${fmt(v)}</b>${seats}</td>`;}).join("")}</tr>`;
  }).join("");
  $("ctSub").textContent=ctSubText();
  // verdict
  const vd=$("verdict"), l=latest(S.cat);
  if(!R){vd.style.display="none";}
  else if(!l){vd.className="verdict v-out";vd.style.display="block";vd.innerHTML=`No ${S.pwd==="yes"?"PwD ":""}allotment was recorded for <b>${esc(CAT_LABEL[S.cat])}</b> in any round, so there is no cutoff to compare with.`;}
  else{
    const ch=chance(R,l.v);
    const msg={safe:"Your rank is comfortably better than the closing rank.",likely:"Your rank is at or better than the closing rank.",border:"Your rank is a little behind the closing rank. It depends on seats left in later rounds.",out:"Your rank is well behind the closing rank."}[ch];
    vd.className="verdict v-"+ch;vd.style.display="block";
    vd.innerHTML=`At AIR <b>${fmt(R)}</b> your chance in <b>${esc(CAT_LABEL[S.cat])}${S.pwd==="yes"?" (PwD)":""}</b> is <b>${CH_LABEL[ch]}</b>. Closing rank in ${RLABEL(l.r)==="Stray"?"the Stray round":l.r} was <b>${fmt(l.v)}</b>. ${msg}`;
  }
}

load();
</script>
